<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
  }

  body {
    background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #333;
    transition: background 0.5s ease;
  }

  body.night-mode {
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    color: #eee;
  }

  .screen {
    display: none;
    width: 100%;
    max-width: 900px;
    padding: 10px;
  }

  .screen.active {
    display: block;
  }

  .glass-panel {
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 15px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
    margin-bottom: 10px;
  }

  body.night-mode .glass-panel {
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  }

  input[type="text"], input[type="password"], input[type="number"], select {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    outline: none;
    background: rgba(255,255,255,0.9);
  }

  button {
    padding: 8px 12px;
    border-radius: 6px;
    border: none;
    background: #0066cc;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  button:hover { opacity: 0.85; }
  button.danger { background: #d9534f; }
  button:disabled { background: #aaa; cursor: not-allowed; }

  /* アクション用ボタン */
  .action-btn {
    font-size: 0.75em;
    padding: 3px 8px;
    border-radius: 4px;
    background: #0066cc;
    color: white;
    border: none;
    cursor: pointer;
  }
  .action-btn.selected {
    background: #28a745;
  }
  .action-btn.danger {
    background: #d9534f;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .room-container {
    display: flex;
    gap: 10px;
    height: calc(100vh - 120px);
    max-height: 650px;
  }

  .left-section {
    width: 280px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }

  .right-section {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* スマホ表示用タブスタイル */
  .mobile-tabs {
    display: none;
    gap: 6px;
    margin: 8px 0;
  }

  .mobile-tab-btn {
    flex: 1;
    padding: 8px;
    font-size: 0.85em;
    background: rgba(255, 255, 255, 0.4);
    color: #333;
    border: 1px solid rgba(0,0,0,0.1);
  }

  .mobile-tab-btn.active {
    background: #0066cc;
    color: white;
  }

  @media (max-width: 768px) {
    .mobile-tabs {
      display: flex;
    }

    .room-container {
      flex-direction: column;
      height: calc(100vh - 160px);
    }

    .left-section, .right-section {
      width: 100% !important;
      height: 100%;
    }

    .left-section.mobile-hidden, .right-section.mobile-hidden {
      display: none !important;
    }
  }

  .chat-box {
    flex: 1;
    overflow-y: auto;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  body.night-mode .chat-box {
    background: rgba(0, 0, 0, 0.4);
  }

  .chat-msg {
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.85);
    font-size: 0.85em;
    max-width: 85%;
    word-wrap: break-word;
    align-self: flex-start;
    color: #333;
  }

  .chat-msg.my-msg {
    align-self: flex-end;
    background: #e3f2fd;
  }

  .chat-msg.sending {
    opacity: 0.5;
  }

  .chat-msg.system {
    align-self: center;
    background: rgba(0, 0, 0, 0.05);
    color: #666;
    font-size: 0.8em;
    border-left: 3px solid #6c757d;
  }

  .chat-msg.private {
    background: #fff3cd;
    color: #856404;
    border-left: 3px solid #fd7e14;
  }

  .chat-msg.wolf {
    background: rgba(220, 53, 69, 0.15);
    border-left: 3px solid #dc3545;
  }

  .chat-msg.grave {
    background: rgba(111, 66, 193, 0.15);
    border-left: 3px solid #6f42c1;
  }

  .chat-msg.soliloquy {
    background: rgba(32, 201, 151, 0.15);
    border-left: 3px solid #20c997;
  }

  /* 夜モード時の視認性向上 */
  body.night-mode .chat-msg {
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
  }

  body.night-mode .chat-msg.my-msg {
    background: rgba(0, 102, 204, 0.4);
    color: #ffffff;
  }

  body.night-mode .chat-msg.system {
    background: rgba(255, 255, 255, 0.1);
    color: #e0e0e0;
    border-left: 3px solid #999;
  }

  body.night-mode .chat-msg.private {
    background: rgba(253, 126, 20, 0.3);
    color: #ffe8cc;
    border-left: 3px solid #ffa94d;
  }

  body.night-mode .chat-msg.wolf {
    background: rgba(220, 53, 69, 0.35);
    color: #ffffff;
    border-left: 3px solid #ff6b6b;
  }

  body.night-mode .chat-msg.grave {
    background: rgba(111, 66, 193, 0.35);
    color: #ffffff;
    border-left: 3px solid #cc5de8;
  }

  body.night-mode .chat-msg.soliloquy {
    background: rgba(32, 201, 151, 0.35);
    color: #ffffff;
    border-left: 3px solid #63e6be;
  }

  .badge {
    font-size: 0.7em;
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: bold;
    color: #fff;
  }
  .badge-system { background: #6c757d; }
  .badge-private { background: #fd7e14; }
  .badge-wolf { background: #dc3545; }
  .badge-grave { background: #6f42c1; }
  .badge-soliloquy { background: #20c997; }
  .badge-chat { background: #0d6efd; }

  .chat-filter-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
    overflow-x: auto;
  }

  .chat-filter-btn {
    font-size: 0.75em;
    padding: 3px 8px;
    background: rgba(255,255,255,0.5);
    border: 1px solid #ccc;
    border-radius: 12px;
    cursor: pointer;
    white-space: nowrap;
    color: #333;
  }

  .chat-filter-btn.active {
    background: #0066cc;
    color: white;
    border-color: #0066cc;
  }

  .setting-group {
    font-size: 0.8em;
    margin-bottom: 6px;
  }
</style>
