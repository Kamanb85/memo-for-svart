<script>
  let currentUser = "";
  let currentRoomId = "";
  let isHost = false;
  let pollingTimer = null;
  let isUpdatingState = false; 
  let isAdvancingPhase = false; 
  let sendingMessages = []; 
  let currentChatFilter = 'ALL';
  let previousPhase = "";
  let lastSoundSec = -1;

  // 簡素な鐘の音（Web Audio APIによるチャイム効果音）
  function playBellSound() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now); // A5 (880Hz)
      osc.frequency.exponentialRampToValueAtTime(440, now + 1.2);

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 1.2);
    } catch(e) {
      console.log("Audio play prevented:", e);
    }
  }

  function switchScreen(screenId) {
    const screens = document.querySelectorAll('.screen');
    screens.forEach(screen => screen.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  // スマホ用タブ切り替え
  function switchMobileTab(tab) {
    const leftSec = document.getElementById('left-section-panel');
    const rightSec = document.getElementById('right-section-panel');
    const btnLeft = document.getElementById('tab-btn-left');
    const btnRight = document.getElementById('tab-btn-right');

    if (tab === 'left') {
      leftSec.classList.remove('mobile-hidden');
      rightSec.classList.add('mobile-hidden');
      btnLeft.classList.add('active');
      btnRight.classList.remove('active');
    } else {
      leftSec.classList.add('mobile-hidden');
      rightSec.classList.remove('mobile-hidden');
      btnLeft.classList.remove('active');
      btnRight.classList.add('active');
    }
  }

  function enterLobby() {
    const nameInput = document.getElementById('username-input');
    const name = nameInput.value.trim();
    if (!name) return alert("名前を入力してください");

    currentUser = name;
    document.getElementById('display-name').innerText = currentUser;
    switchScreen('lobby-screen');
    loadRoomList();
  }

  function loadRoomList() {
    google.script.run.withSuccessHandler(rooms => {
      const container = document.getElementById('room-list');
      if (!rooms || rooms.length === 0) {
        container.innerHTML = '<p style="font-size: 0.9em; color: #666; margin-top: 20px;">現在部屋はありません</p>';
        return;
      }
      let html = '';
      rooms.forEach(r => {
        html += `
          <div style="border-bottom: 1px solid rgba(0,0,0,0.1); padding: 8px; text-align: left; cursor: pointer;" onclick="joinRoom('${r.id}')">
            <strong>${r.name}</strong> (ID: ${r.id}) - <span style="color:#0066cc;">${r.status}</span><br>
            <span style="font-size: 0.8em; color: #555;">参加者: ${r.members.join(', ')}</span>
          </div>
        `;
      });
      container.innerHTML = html;
    }).getRoomList();
  }

  function createRoom() {
    const roomName = document.getElementById('new-room-name').value;
    if (!roomName) return alert("ルーム名を入力してください");

    google.script.run.withSuccessHandler(res => {
      if (res.success) enterRoom(res.roomId);
      else alert(res.message);
    }).createRoom(roomName, currentUser);
  }

  function joinRoomById() {
    const roomId = document.getElementById('join-room-id').value;
    if (!roomId || roomId.length !== 4) return alert("4桁のルームIDを入力してください");
    joinRoom(roomId);
  }

  function joinRoom(roomId) {
    google.script.run.withSuccessHandler(res => {
      if (res.success) enterRoom(res.room.id);
      else alert(res.message);
    }).joinRoom(roomId, currentUser);
  }

  function enterRoom(roomId) {
    currentRoomId = roomId;
    switchScreen('game-screen');
    startPolling();
  }

  function startPolling() {
    if (pollingTimer) clearInterval(pollingTimer);
    updateRoomState();
    pollingTimer = setInterval(updateRoomState, 3000); 
  }

  function stopPolling() {
    if (pollingTimer) clearInterval(pollingTimer);
  }

  function updateRoomState() {
    if (!currentRoomId || !currentUser || isUpdatingState) return;

    isUpdatingState = true;

    google.script.run
      .withFailureHandler(err => {
        console.error("同期エラー:", err);
        isUpdatingState = false;
      })
      .withSuccessHandler(res => {
        isUpdatingState = false;

        if (!res || !res.success) {
          if (res && res.kicked) {
            alert("部屋からキックされました。");
            stopPolling();
            currentRoomId = "";
            switchScreen('lobby-screen');
            loadRoomList();
          }
          return;
        }

        const room = res.room;
        const players = res.players;
        const myInfo = res.myInfo;
        const logs = res.logs;

        isHost = (room.host === currentUser);

        // 朝（DAY）に移行した際は自動で送信先を全体にリセット
        if (previousPhase !== room.status) {
          if (room.status === 'DAY') {
            const channelSelect = document.getElementById('chat-channel-select');
            if (channelSelect) channelSelect.value = 'CHAT';
          }
          lastSoundSec = -1; // フェーズが変わったらサウンド用フラグを初期化
        }
        previousPhase = room.status;

        if (room.status === 'NIGHT' || room.status === 'FIRST_NIGHT') {
          document.body.classList.add('night-mode');
        } else {
          document.body.classList.remove('night-mode');
        }

        document.getElementById('header-room-name').innerText = room.name;
        document.getElementById('header-room-id').innerText = room.id;
        
        const advBtn = document.getElementById('advance-phase-btn');
        advBtn.style.display = (isHost && room.status !== 'LOBBY' && room.status !== 'FINISHED') ? 'inline-block' : 'none';

        const resetBtn = document.getElementById('reset-lobby-btn');
        if (resetBtn) {
          resetBtn.style.display = (isHost && room.status === 'FINISHED') ? 'inline-block' : 'none';
        }

        let timerStr = "";
        if (room.endTime > 0 && room.status !== 'LOBBY' && room.status !== 'FINISHED') {
          const remainingSec = Math.max(0, Math.floor((room.endTime - new Date().getTime()) / 1000));
          const min = Math.floor(remainingSec / 60);
          const sec = remainingSec % 60;
          timerStr = ` [残り ${min}:${sec < 10 ? '0' : ''}${sec}]`;

          // 30秒前・10秒前に鐘の音を鳴らす
          if ((remainingSec === 30 || remainingSec === 10) && lastSoundSec !== remainingSec) {
            playBellSound();
            lastSoundSec = remainingSec;
          }

          if (remainingSec === 0 && isHost && !isAdvancingPhase) {
            isAdvancingPhase = true;
            advancePhase();
          }
        }

        let phaseText = '';
        if (room.status === 'LOBBY') phaseText = '待機中 (ロビー)';
        else if (room.status === 'FIRST_NIGHT') phaseText = `${room.day}日目 【初日夜】` + timerStr;
        else if (room.status === 'DAY') phaseText = `${room.day}日目 【昼の議論】` + timerStr;
        else if (room.status === 'VOTE') phaseText = `${room.day}日目 【投票中】` + timerStr;
        else if (room.status === 'NIGHT') phaseText = `${room.day}日目 【夜の行動】` + timerStr;
        else if (room.status === 'FINISHED') phaseText = `【ゲーム終了】`;
        document.getElementById('header-phase-info').innerText = phaseText;

        // 役職カード
        const roleCard = document.getElementById('my-role-card');
        if (room.status !== 'LOBBY' && myInfo.role) {
          roleCard.style.display = 'block';
          document.getElementById('my-role-title').innerText = myInfo.role;
          document.getElementById('my-status-tag').innerHTML = myInfo.isAlive 
            ? '<span style="color:green; font-weight:bold;">[生存]</span>' 
            : '<span style="color:red; font-weight:bold;">[死亡]</span>';
        } else {
          roleCard.style.display = 'none';
        }

        // ロビー設定
        if (room.status === 'LOBBY') {
          document.getElementById('lobby-settings-panel').style.display = 'block';
          document.getElementById('host-badge').style.display = isHost ? 'inline' : 'none';
          document.getElementById('start-game-btn').style.display = isHost ? 'block' : 'none';

          const inputs = document.querySelectorAll('.setting-group input, .setting-group select');
          inputs.forEach(inp => inp.disabled = !isHost);

          if (room.roles) {
            document.getElementById('setting-day-time').value = room.dayTime || 4;
            document.getElementById('setting-vote-time').value = room.voteTime || 1;
            document.getElementById('setting-night-time').value = room.nightTime || 1;
            document.getElementById('setting-tie-rule').value = room.tieRule || 'random';

            document.getElementById('role-villager').value = room.roles.villager || 0;
            document.getElementById('role-seer').value = room.roles.seer || 0;
            document.getElementById('role-medium').value = room.roles.medium || 0;
            document.getElementById('role-bodyguard').value = room.roles.bodyguard || 0;
            document.getElementById('role-madman').value = room.roles.madman || 0;
            document.getElementById('role-werewolf').value = room.roles.werewolf || 0;
            document.getElementById('role-fox').value = room.roles.fox || 0;
            calcRoleTotal();
          }
        } else {
          document.getElementById('lobby-settings-panel').style.display = 'none';
        }

        // ゲーム情報・記録パネル
        if (room.status !== 'LOBBY' && room.roles) {
          document.getElementById('game-record-panel').style.display = 'block';
          const roleNames = {
            villager: '村人', werewolf: '人狼', seer: '占い師',
            medium: '霊媒師', bodyguard: '狩人', madman: '狂人', fox: '妖狐'
          };
          let rList = [];
          for (let k in room.roles) {
            if (room.roles[k] > 0) {
              rList.push(`${roleNames[k] || k} - ${room.roles[k]}人`);
            }
          }
          document.getElementById('role-breakdown-info').innerText = rList.join(' / ');

          let pLogsHtml = '';
          if (logs && logs.length > 0) {
            logs.filter(l => l.type === 'PRIVATE').forEach(l => {
              pLogsHtml += `<div style="margin-bottom: 3px; font-size: 0.8em; color: #d9534f;">• ${l.msg}</div>`;
            });
          }
          if (!pLogsHtml) pLogsHtml = '<span style="color:#888;">記録はありません</span>';
          document.getElementById('personal-action-logs').innerHTML = pLogsHtml;
        } else {
          document.getElementById('game-record-panel').style.display = 'none';
        }

        // 送信先プルダウン制御
        const channelSelect = document.getElementById('chat-channel-select');
        const prevChan = channelSelect.value;
        let chanHtml = '';

        if (room.status === 'FINISHED') {
          chanHtml += '<option value="CHAT">💬 全体会話</option>';
        } else if (!myInfo.isAlive) {
          chanHtml += '<option value="GRAVE">👻 霊界会話</option>';
        } else if (room.status === 'NIGHT' || room.status === 'FIRST_NIGHT') {
          if (myInfo.role === '人狼') {
            chanHtml += '<option value="WOLF">🐺 人狼の囁き</option>';
          }
        } else {
          chanHtml += '<option value="CHAT">💬 全体会話</option>';
          if (myInfo.role === '人狼') {
            chanHtml += '<option value="WOLF">🐺 人狼の囁き</option>';
          }
        }
        chanHtml += '<option value="SOLILOQUY">🔒 独り言 (自分のみ)</option>';
        channelSelect.innerHTML = chanHtml;
        if (prevChan && channelSelect.querySelector(`option[value="${prevChan}"]`)) {
          channelSelect.value = prevChan;
        }

        // 参加者一覧＆アクションボタン（ワンタップ操作）
        document.getElementById('player-count').innerText = players.length;
        let playerHtml = '';
        players.forEach(p => {
          let statusStr = p.isAlive ? '<span style="color:green;">[生]</span>' : '<span style="color:gray;">[死]</span>';
          let roleTag = p.role ? ` <span style="font-size:0.8em; color:#d9534f; font-weight:bold;">(${p.role})</span>` : '';
          let hostTag = (p.name === room.host) ? ' <span style="font-size:0.75em; color:#0066cc;">[主]</span>' : '';

          let actionBtnHtml = '';

          if (myInfo.isAlive && room.status !== 'LOBBY' && room.status !== 'FINISHED') {
            if (room.status === 'VOTE' && p.isAlive && p.name !== currentUser) {
              const isSelected = (myInfo.voteTarget === p.name);
              const btnText = isSelected ? '✓ 投票中' : '投票';
              const btnClass = isSelected ? 'action-btn selected' : 'action-btn';
              actionBtnHtml = `<button onclick="doAction('${p.name}', 'VOTE')" class="${btnClass}">${btnText}</button>`;
            } else if (room.status === 'NIGHT' && p.isAlive) {
              if (myInfo.role === '占い師' && p.name !== currentUser) {
                const isSelected = (myInfo.actionTarget === p.name);
                const btnText = isSelected ? '✓ 占い選択' : '占う';
                const btnClass = isSelected ? 'action-btn selected' : 'action-btn';
                actionBtnHtml = `<button onclick="doAction('${p.name}', 'NIGHT')" class="${btnClass}">${btnText}</button>`;
              } else if (myInfo.role === '人狼' && p.role !== '人狼') {
                const isSelected = (myInfo.actionTarget === p.name);
                const btnText = isSelected ? '✓ 襲撃選択' : '襲撃';
                const btnClass = isSelected ? 'action-btn selected' : 'action-btn danger';
                actionBtnHtml = `<button onclick="doAction('${p.name}', 'NIGHT')" class="${btnClass}">${btnText}</button>`;
              } else if (myInfo.role === '狩人' && p.name !== currentUser) {
                const isSelected = (myInfo.actionTarget === p.name);
                const btnText = isSelected ? '✓ 護衛選択' : '護衛';
                const btnClass = isSelected ? 'action-btn selected' : 'action-btn';
                actionBtnHtml = `<button onclick="doAction('${p.name}', 'NIGHT')" class="${btnClass}">${btnText}</button>`;
              }
            }
          }

          let kickBtn = (isHost && p.name !== currentUser && room.status === 'LOBBY') 
            ? `<button onclick="kickPlayer('${p.name}')" class="danger" style="padding: 2px 6px; font-size: 0.75em;">キック</button>` 
            : '';

          playerHtml += `
            <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.7); padding: 6px 10px; border-radius: 6px;">
              <div>
                ${statusStr} <strong>${p.name}</strong>${hostTag}${roleTag}
              </div>
              <div style="display: flex; gap: 4px; align-items: center;">
                ${actionBtnHtml}
                ${kickBtn}
              </div>
            </div>
          `;
        });
        document.getElementById('player-list-box').innerHTML = playerHtml;

        // チャットログ描画
        let chatHtml = '';
        if (logs && logs.length > 0) {
          logs.forEach(l => {
            if (currentChatFilter !== 'ALL') {
              if (currentChatFilter === 'CHAT' && l.type !== 'CHAT') return;
              if (currentChatFilter === 'WOLF' && l.type !== 'WOLF') return;
              if (currentChatFilter === 'GRAVE' && l.type !== 'GRAVE') return;
              if (currentChatFilter === 'SOLILOQUY' && l.type !== 'SOLILOQUY') return;
              if (currentChatFilter === 'SYSTEM' && (l.type !== 'SYSTEM' && l.type !== 'PRIVATE')) return;
            }

            let isSys = (l.type === 'SYSTEM' || l.type === 'PRIVATE');
            let isMe = (l.sender === currentUser && !isSys);

            let typeBadge = '';
            let msgClass = '';

            if (l.type === 'SYSTEM') {
              typeBadge = '<span class="badge badge-system">システム</span> ';
              msgClass = 'system';
            } else if (l.type === 'PRIVATE') {
              typeBadge = '<span class="badge badge-private">判定</span> ';
              msgClass = 'system private';
            } else if (l.type === 'WOLF') {
              typeBadge = '<span class="badge badge-wolf">人狼</span> ';
              msgClass = 'wolf';
            } else if (l.type === 'GRAVE') {
              typeBadge = '<span class="badge badge-grave">霊界</span> ';
              msgClass = 'grave';
            } else if (l.type === 'SOLILOQUY') {
              typeBadge = '<span class="badge badge-soliloquy">独り言</span> ';
              msgClass = 'soliloquy';
            } else {
              typeBadge = '<span class="badge badge-chat">全体</span> ';
            }

            let formattedMsg = l.msg.replace(/\n/g, '<br>');

            chatHtml += `
              <div class="chat-msg ${msgClass} ${isMe ? 'my-msg' : ''}">
                <span style="font-size: 0.75em; opacity: 0.8;">[${l.time}]</span> 
                ${typeBadge}
                <strong>${isMe ? '' : l.sender + ':'}</strong> ${formattedMsg}
              </div>
            `;
          });
        }

        sendingMessages.forEach(sMsg => {
          chatHtml += `
            <div class="chat-msg my-msg sending">
              <span style="font-size: 0.75em; opacity: 0.8;">[送信中...]</span> 
              ${sMsg}
            </div>
          `;
        });

        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = chatHtml;
        chatBox.scrollTop = chatBox.scrollHeight;

      }).getRoomDetails(currentRoomId, currentUser);
  }

  function doAction(targetName, actionType) {
    google.script.run.withSuccessHandler(res => {
      if (res.success) updateRoomState();
    }).submitAction(currentRoomId, currentUser, targetName, actionType);
  }

  function setChatFilter(filterType) {
    currentChatFilter = filterType;
    document.querySelectorAll('.chat-filter-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`filter-btn-${filterType}`).classList.add('active');
    updateRoomState();
  }

  function startGame() {
    if (!isHost) return;
    if (!confirm("ゲームを開始しますか？")) return;

    google.script.run.withSuccessHandler(res => {
      if (!res.success) alert(res.message);
      else updateRoomState();
    }).startGame(currentRoomId);
  }

  function advancePhase() {
    google.script.run.withSuccessHandler(res => {
      isAdvancingPhase = false;
      if (res && res.success) updateRoomState();
    }).advancePhase(currentRoomId);
  }

  function resetRoomToLobby() {
    if (!isHost) return;
    if (!confirm("全員を待機ロビーに戻して、もう一度ゲームを開始できるようにしますか？")) return;

    google.script.run.withSuccessHandler(res => {
      if (res.success) updateRoomState();
      else alert(res.message);
    }).resetRoomToLobby(currentRoomId);
  }

  function calcRoleTotal() {
    const inputs = document.querySelectorAll('.role-input');
    let total = 0;
    inputs.forEach(inp => total += parseInt(inp.value || 0));
    document.getElementById('role-total-count').innerText = total;

    if (isHost) {
      saveSettings();
    }
  }

  function saveSettings() {
    if (!isHost || !currentRoomId) return;
    const settings = {
      dayTime: document.getElementById('setting-day-time').value,
      voteTime: document.getElementById('setting-vote-time').value,
      nightTime: document.getElementById('setting-night-time').value,
      tieRule: document.getElementById('setting-tie-rule').value,
      roles: {
        villager: parseInt(document.getElementById('role-villager').value || 0),
        seer: parseInt(document.getElementById('role-seer').value || 0),
        medium: parseInt(document.getElementById('role-medium').value || 0),
        bodyguard: parseInt(document.getElementById('role-bodyguard').value || 0),
        madman: parseInt(document.getElementById('role-madman').value || 0),
        werewolf: parseInt(document.g
